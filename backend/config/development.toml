[server]
host = "0.0.0.0"
port = 8080

[database]
url = "postgres://halo:halo@localhost:5432/halo"
max_connections = 10

[jwt]
secret = "dev-secret-not-for-production"
access_token_expiration_secs = 900
refresh_token_expiration_secs = 604800
issuer = "halo-server"

[observability]
log_level = "debug"
log_format = "pretty"
enable_metrics = false
